<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Sina Mahboobipour — Software Engineer">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset="1" stop-color="#141c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.47" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-width=".65" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-45%" width="180%" height="190%"><feGaussianBlur stdDeviation="17"/></filter>
    <clipPath id="clip"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="400" fill="url(#background)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <ellipse cx="945" cy="175" rx="370" ry="300" fill="url(#glow)"/>
    <path d="M635 0H1200V400H720" fill="none" stroke="#364462" stroke-width="1" opacity=".26"/>
    <path d="M680 0 950 400M860 0l270 400" stroke="#364462" stroke-width="1" opacity=".13"/>

    <!-- Editorial label -->
    <rect x="64" y="45" width="223" height="32" rx="16" fill="#121b31" stroke="#364462" stroke-width="1"/>
    <circle cx="83" cy="61" r="4" fill="#67e8f9"/>
    <text x="98" y="65.2" fill="#a8b5cd" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.1">ENGINEER / BUILDER</text>

    <!-- Heading -->
    <text x="61" y="169" fill="#f5f7ff" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="82" letter-spacing="-4" font-weight="760">Sina</text>
    <text x="61" y="238" fill="#f5f7ff" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="65" letter-spacing="-3.5" font-weight="750">Mahboobipour<tspan fill="#8b9af0">.</tspan></text>
    <rect x="64" y="261" width="57" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="297" fill="#a8b5cd" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" letter-spacing=".1">Software engineer</text>
    <text x="64" y="325" fill="#a8b5cd" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19">Algorithms <tspan fill="#8b8bf0">/</tspan> Systems <tspan fill="#8b8bf0">/</tspan> Problem solving</text>

    <!-- Abstract construction / coding window -->
    <g opacity=".7">
      <circle cx="931" cy="187" r="170" stroke="url(#accent)" stroke-width="1.2" fill="none" stroke-dasharray="3 11"/>
      <circle cx="931" cy="187" r="208" stroke="#364462" stroke-width="1" fill="none" stroke-dasharray="2 18"/>
      <circle cx="1130" cy="127" r="5" fill="#67e8f9"/>
      <circle cx="782" cy="287" r="5" fill="#a78bfa"/>
    </g>
    <g transform="rotate(-7 951 192)">
      <rect x="761" y="97" width="391" height="233" rx="17" fill="#000000" opacity=".28" filter="url(#shadow)"/>
      <rect x="754" y="88" width="391" height="233" rx="17" fill="#121b31" stroke="#364462" stroke-width="1.5"/>
      <rect x="755" y="89" width="389" height="44" rx="16" fill="#0c1427"/>
      <rect x="755" y="119" width="389" height="15" fill="#0c1427"/>
      <path d="M755 134H1144" stroke="#293956" stroke-width="1"/>
      <circle cx="780" cy="111" r="5" fill="#fa7185"/>
      <circle cx="798" cy="111" r="5" fill="#f4c56a"/>
      <circle cx="816" cy="111" r="5" fill="#65d7b3"/>
      <text x="947" y="115" text-anchor="middle" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="12">sina / workspace</text>
      <text x="783" y="175" fill="#7d91b3" font-family="ui-monospace, Consolas, monospace" font-size="14">// find a better way</text>
      <text x="783" y="211" font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="600"><tspan fill="#a78bfa">const</tspan><tspan fill="#f5f7ff"> mindset = </tspan><tspan fill="#67e8f9">&#34;build&#34;</tspan><tspan fill="#f5f7ff">;</tspan></text>
      <text x="783" y="248" font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="600"><tspan fill="#a78bfa">while</tspan><tspan fill="#f5f7ff"> (curious) &#123;</tspan></text>
      <text x="808" y="282" font-family="ui-monospace, Consolas, monospace" font-size="17"><tspan fill="#67e8f9">learn</tspan><tspan fill="#f5f7ff">(); </tspan><tspan fill="#67e8f9">ship</tspan><tspan fill="#f5f7ff">();</tspan></text>
      <text x="783" y="303" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#f5f7ff">&#125;</text>
    </g>

    <!-- bottom rule and labels -->
    <path d="M64 356H1136" stroke="#364462" stroke-width="1" opacity=".55"/>
    <text x="64" y="380" fill="#7b8ba8" font-size="11.5" font-weight="650" font-family="ui-monospace, Consolas, monospace" letter-spacing="1.6">PYTHON  ·  C++  ·  C  ·  WEB</text>
    <text x="1137" y="380" text-anchor="end" fill="#7b8ba8" font-size="11.5" font-weight="650" font-family="ui-monospace, Consolas, monospace" letter-spacing="1.2">TEHRAN, IRAN  /  IUST</text>
  </g>
</svg>