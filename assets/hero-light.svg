<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Sina Mahboobipour — Software Engineer">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf3fd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.47" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".15"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#526fa0" stroke-width=".65" opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-45%" width="180%" height="190%"><feGaussianBlur stdDeviation="17"/></filter>
    <clipPath id="clip"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="400" fill="url(#background)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <ellipse cx="945" cy="175" rx="370" ry="300" fill="url(#glow)"/>
    <path d="M635 0H1200V400H720" fill="none" stroke="#cbd8ec" stroke-width="1" opacity=".26"/>
    <path d="M680 0 950 400M860 0l270 400" stroke="#cbd8ec" stroke-width="1" opacity=".13"/>

    <!-- Editorial label -->
    <rect x="64" y="45" width="223" height="32" rx="16" fill="#ffffff" stroke="#cbd8ec" stroke-width="1"/>
    <circle cx="83" cy="61" r="4" fill="#67e8f9"/>
    <text x="98" y="65.2" fill="#56657f" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.1">ENGINEER / BUILDER</text>

    <!-- Heading -->
    <text x="61" y="169" fill="#121b34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="82" letter-spacing="-4" font-weight="760">Sina</text>
    <text x="61" y="238" fill="#121b34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="65" letter-spacing="-3.5" font-weight="750">Mahboobipour<tspan fill="#8b9af0">.</tspan></text>
    <rect x="64" y="261" width="57" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="297" fill="#56657f" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" letter-spacing=".1">Software engineer</text>
    <text x="64" y="325" fill="#56657f" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19">C + C++ <tspan fill="#8b8bf0">/</tspan> Algorithms <tspan fill="#8b8bf0">/</tspan> Systems</text>

    <!-- Abstract construction / coding window -->
    <g opacity=".7">
      <circle cx="931" cy="187" r="170" stroke="url(#accent)" stroke-width="1.2" fill="none" stroke-dasharray="3 11"/>
      <circle cx="931" cy="187" r="208" stroke="#cbd8ec" stroke-width="1" fill="none" stroke-dasharray="2 18"/>
      <circle cx="1130" cy="127" r="5" fill="#67e8f9"/>
      <circle cx="782" cy="287" r="5" fill="#a78bfa"/>
    </g>
    <g transform="rotate(-7 951 192)">
      <rect x="761" y="97" width="391" height="233" rx="17" fill="#6c8ab6" opacity=".22" filter="url(#shadow)"/>
      <rect x="754" y="88" width="391" height="233" rx="17" fill="#ffffff" stroke="#cbd8ec" stroke-width="1.5"/>
      <rect x="755" y="89" width="389" height="44" rx="16" fill="#f3f7ff"/>
      <rect x="755" y="119" width="389" height="15" fill="#f3f7ff"/>
      <path d="M755 134H1144" stroke="#d7e2f3" stroke-width="1"/>
      <circle cx="780" cy="111" r="5" fill="#fa7185"/>
      <circle cx="798" cy="111" r="5" fill="#f4c56a"/>
      <circle cx="816" cy="111" r="5" fill="#65d7b3"/>
      <text x="947" y="115" text-anchor="middle" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="12">main.cpp   ·   core.c</text>
      <text x="783" y="175" fill="#7083a4" font-family="ui-monospace, Consolas, monospace" font-size="14">// built with C and C++</text>
      <text x="783" y="211" font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="600"><tspan fill="#7c3aed">#include</tspan><tspan fill="#121b34"> &lt;iostream&gt;</tspan></text>
      <text x="783" y="248" font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="600"><tspan fill="#7c3aed">int</tspan><tspan fill="#121b34"> main() &#123;</tspan></text>
      <text x="808" y="282" font-family="ui-monospace, Consolas, monospace" font-size="16"><tspan fill="#121b34">std::cout &lt;&lt; </tspan><tspan fill="#0891b2">&#34;keep building&#34;</tspan><tspan fill="#121b34">;</tspan></text>
      <text x="783" y="303" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#121b34">&#125;</text>
    </g>

    <!-- bottom rule and labels -->
    <path d="M64 356H1136" stroke="#cbd8ec" stroke-width="1" opacity=".55"/>
    <text x="64" y="380" fill="#8c9cba" font-size="11.5" font-weight="650" font-family="ui-monospace, Consolas, monospace" letter-spacing="1.6">C  ·  C++  ·  PYTHON  ·  WEB</text>
    <text x="1137" y="380" text-anchor="end" fill="#8c9cba" font-size="11.5" font-weight="650" font-family="ui-monospace, Consolas, monospace" letter-spacing="1.2">TEHRAN, IRAN  /  IUST</text>
  </g>
</svg>